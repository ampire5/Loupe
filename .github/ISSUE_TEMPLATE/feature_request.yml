name: Feature request
description: Something Loupe could do for you
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Requests from people who use Loupe every day shape the roadmap.
  - type: textarea
    id: want
    attributes:
      label: What would you like to do?
      description: The task, in your own words. A screenshot or an example file helps.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Another app, a workaround, or not at all.
  - type: textarea
    id: setup
    attributes:
      label: Your setup (optional)
      description: The size of your collection and where it lives (local disk, NAS over SMB, Stash…), your display, your mouse.
