name: CI (LTS, Intel)

# The lts/macos26 line: macOS 26 on Intel Macs (LTS_POLICY.md in FrameScrub). GitHub has no Intel runner with macOS 26,
# so the job runs on the Apple Silicon macos-26 image with the build steps under Rosetta: SwiftPM builds and tests x86_64.
on:
  push:
    branches: [lts/macos26]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: arch -x86_64 /bin/bash -eo pipefail {0}

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Rosetta and Xcode 26
        shell: bash
        run: |
          /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: |
          uname -m
          swift --version
      - name: Homebrew tools
        shell: bash
        run: brew install cmake ninja nasm pkgconf
      - name: Cache decoders
        uses: actions/cache@v4
        with:
          path: .deps/x86_64
          key: deps-x86_64-${{ hashFiles('scripts/build-deps.sh') }}
      - name: Decoders (prebuilt, or built from source)
        run: scripts/deps.sh fetch
      # The render tests compare pixels on the GPU; GitHub's virtual machines get a paravirtual one, so CI runs the core suite.
      - name: Test
        run: scripts/test.sh --no-parallel   # timing tests share 3 cores badly in parallel
      - name: Build the app
        run: scripts/make-app.sh
      - name: Upload the app
        run: ditto -c -k --keepParent build/Loupe.app Loupe-macOS-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Loupe-macOS-x86_64
          path: Loupe-macOS-x86_64.zip
