name: Backport to LTS

# A merged pull request labelled `backport:lts` (fix) or `backport:lts-feature` (feature) is cherry-picked onto
# lts/macos26, the macOS 26 Intel line, as a new pull request there; on a conflict it opens as a draft with the
# conflict committed, to resolve by hand. Policy: LTS_POLICY.md on lts/macos26 in FrameScrub.
on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    if: >-
      github.event.pull_request.merged &&
      (contains(github.event.pull_request.labels.*.name, 'backport:lts') ||
       contains(github.event.pull_request.labels.*.name, 'backport:lts-feature'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: korthout/backport-action@v3
        with:
          label_pattern: ''
          target_branches: lts/macos26
          pull_title: '[LTS] ${pull_title}'
          pull_description: |-
            Backport of #${pull_number} to `lts/macos26` (macOS 26, Intel).

            ${pull_description}
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'
