name: Prebuilt dependencies

# Builds scripts/build-deps.sh's recipe from source for each architecture, arm64 and x86_64 (Intel Macs, macOS 26), and
# publishes it as the pre-release deps-<arch>-<recipe hash>, which scripts/deps.sh downloads (CI, releases, local
# builds). Runs when the recipe changes on main, and by hand; a recipe that is already published is left alone.
on:
  push:
    branches: [main]
    paths: [scripts/build-deps.sh, .github/workflows/deps.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: xcode-27
            tools: cmake ninja pkgconf
          - arch: x86_64
            runner: macos-26
            tools: cmake ninja nasm pkgconf
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      DEPS_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Already published?
        id: check
        run: |
          name=$(scripts/deps.sh name)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if gh release view "$name" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name is already published"
          fi
      - name: Rosetta and Xcode 26
        if: steps.check.outputs.published != 'true' && matrix.arch == 'x86_64'
        run: |
          /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      - name: Homebrew tools
        if: steps.check.outputs.published != 'true'
        run: brew install ${{ matrix.tools }}
      - name: Build from source
        if: steps.check.outputs.published != 'true'
        run: scripts/deps.sh fetch
      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: |
          name=${{ steps.check.outputs.name }}
          scripts/deps.sh pack out
          gh release create "$name" "out/$name.tar.xz" "out/$name.tar.xz.sha256" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Build dependencies: $name" \
            --notes "Static $DEPS_ARCH libraries for ${GITHUB_REF_NAME}, built by scripts/build-deps.sh at ${GITHUB_SHA::7}. Downloaded by scripts/deps.sh; not an app release."
